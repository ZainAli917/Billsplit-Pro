<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8f135"/>
      <stop offset="100%" stop-color="#8adb00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="30.72" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="184.32" fill="url(#bg)"/>

  <!-- Glow circle behind icon -->
  <circle cx="512.0" cy="450.56" r="286.72" fill="rgba(200,241,53,0.07)"/>

  <!-- Split line (visual) -->
  <line x1="286.72" y1="450.56" x2="737.28" y2="450.56"
        stroke="url(#lime)" stroke-width="25.6" stroke-linecap="round" opacity="0.3"/>

  <!-- Rs symbol left -->
  <text x="286.72" y="512.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="225.28"
        fill="url(#lime)" filter="url(#glow)">₹</text>

  <!-- Divide symbol center -->
  <text x="512.0" y="542.72"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="286.72"
        fill="#ffffff" opacity="0.9">÷</text>

  <!-- $ symbol right -->
  <text x="737.28" y="512.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="225.28"
        fill="url(#lime)" filter="url(#glow)">$</text>

  <!-- App name -->
  <text x="512.0" y="778.24"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="133.12"
        fill="#c8f135" letter-spacing="2.048">BILLSPLIT</text>

  <!-- Tagline -->
  <text x="512.0" y="901.12"
        text-anchor="middle" font-family="Arial, sans-serif"
        font-weight="400" font-size="76.8"
        fill="rgba(255,255,255,0.35)" letter-spacing="1.024">PRO</text>
</svg>