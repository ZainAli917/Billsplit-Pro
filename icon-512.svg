<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8f135"/>
      <stop offset="100%" stop-color="#8adb00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15.36" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="92.16" fill="url(#bg)"/>

  <!-- Glow circle behind icon -->
  <circle cx="256.0" cy="225.28" r="143.36" fill="rgba(200,241,53,0.07)"/>

  <!-- Split line (visual) -->
  <line x1="143.36" y1="225.28" x2="368.64" y2="225.28"
        stroke="url(#lime)" stroke-width="12.8" stroke-linecap="round" opacity="0.3"/>

  <!-- Rs symbol left -->
  <text x="143.36" y="256.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="112.64"
        fill="url(#lime)" filter="url(#glow)">₹</text>

  <!-- Divide symbol center -->
  <text x="256.0" y="271.36"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="143.36"
        fill="#ffffff" opacity="0.9">÷</text>

  <!-- $ symbol right -->
  <text x="368.64" y="256.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="112.64"
        fill="url(#lime)" filter="url(#glow)">$</text>

  <!-- App name -->
  <text x="256.0" y="389.12"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="66.56"
        fill="#c8f135" letter-spacing="1.024">BILLSPLIT</text>

  <!-- Tagline -->
  <text x="256.0" y="450.56"
        text-anchor="middle" font-family="Arial, sans-serif"
        font-weight="400" font-size="38.4"
        fill="rgba(255,255,255,0.35)" letter-spacing="0.512">PRO</text>
</svg>