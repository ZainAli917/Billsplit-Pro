<!DOCTYPE html>

<head>

<meta name="apple-mobile-web-app-title" content="BillSplit Pro">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Split bills fairly with friends. Zero drama, instant settlements.">

<title>BillSplit Pro — Fair Split, Zero Drama</title>

<!-- PWA Manifest -->

<!-- iOS & PWA Icons -->
<link rel="apple-touch-icon" href="./icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ═══════════════════════════════════════
   DESIGN TOKENS + ALL YOUR STYLES
═══════════════════════════════════════ */
:root {
  --bg:      #0f0f14;
  --surface: #17171f;
  --card:    #1e1e28;
  --card2:   #252532;
  --border:  rgba(255,255,255,0.07);
  --text:    #f0f0f8;
  --sub:     #7f7f9a;
  --lime:    #c8f135;
  --lime2:   #a8d420;
  --blue:    #4f8aff;
  --red:     #ff5f5f;
  --amber:   #ffb444;
  --green:   #3dd68c;
  --purple:  #a78bfa;
  --pink:    #f472b6;
  --r:       16px;
  --r2:      12px;
  --font:    'Anybody', sans-serif;
  --body:    'DM Sans', sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
::-webkit-scrollbar { width:0; height:0; }

body {
  font-family: var(--body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  max-width: 430px;
  margin: 0 auto;
  overflow-x: hidden;
  padding-bottom: calc(80px + var(--safe-bot));
  padding-top: var(--safe-top);
}

/* ... (Baaki pura style same rakh do jo pehle tha) ... */
</style>
</head>
<body>

<!-- Tumhara pura body content same rahega (install banner, header, pages, modals etc.) -->

<!-- INSTALL BANNER -->
<div class="install-banner" id="installBanner">
  <div class="ib-text"><b>Install BillSplit Pro</b><br>Add to home screen for best experience</div>
  <button class="ib-btn" id="installBtn" onclick="installApp()">Install</button>
  <button class="ib-close" onclick="dismissInstall()">×</button>
</div>

<!-- HEADER, PAGES, MODALS etc. — sab same rahega (main ne sirf head update kiya hai) -->

<!-- Bottom Nav, FAB, Modals etc. same as before -->

<script>
// ═══════════════════════════════════════════════════
//  PWA INSTALL + SERVICE WORKER
// ═══════════════════════════════════════════════════
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  if (!localStorage.getItem('bsp_install_dismissed')) {
    document.getElementById('installBanner').classList.add('show');
  }
});

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(r => {
      if (r.outcome === 'accepted') toast('✓ App installed!');
      document.getElementById('installBanner').classList.remove('show');
      deferredPrompt = null;
    });
  }
}

function dismissInstall() {
  document.getElementById('installBanner').classList.remove('show');
  localStorage.setItem('bsp_install_dismissed', '1');
}

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .then(reg => console.log('✅ Service Worker Registered'))
    .catch(err => console.log('❌ SW registration failed:', err));
}

// Baaki pura script (STATE, functions, render etc.) same rahega jo pehle tha
</script>
</body>
</html>
