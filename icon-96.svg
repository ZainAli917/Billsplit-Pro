<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8f135"/>
      <stop offset="100%" stop-color="#8adb00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.88" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="96" height="96" rx="17.28" fill="url(#bg)"/>

  <!-- Glow circle behind icon -->
  <circle cx="48.0" cy="42.24" r="26.880000000000003" fill="rgba(200,241,53,0.07)"/>

  <!-- Split line (visual) -->
  <line x1="26.880000000000003" y1="42.24" x2="69.12" y2="42.24"
        stroke="url(#lime)" stroke-width="2.4000000000000004" stroke-linecap="round" opacity="0.3"/>

  <!-- Rs symbol left -->
  <text x="26.880000000000003" y="48.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="21.12"
        fill="url(#lime)" filter="url(#glow)">₹</text>

  <!-- Divide symbol center -->
  <text x="48.0" y="50.88"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="26.880000000000003"
        fill="#ffffff" opacity="0.9">÷</text>

  <!-- $ symbol right -->
  <text x="69.12" y="48.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="21.12"
        fill="url(#lime)" filter="url(#glow)">$</text>

  <!-- App name -->
  <text x="48.0" y="72.96000000000001"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="12.48"
        fill="#c8f135" letter-spacing="0.192">BILLSPLIT</text>

  <!-- Tagline -->
  <text x="48.0" y="84.48"
        text-anchor="middle" font-family="Arial, sans-serif"
        font-weight="400" font-size="7.199999999999999"
        fill="rgba(255,255,255,0.35)" letter-spacing="0.096">PRO</text>
</svg>