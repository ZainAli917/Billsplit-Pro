<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8f135"/>
      <stop offset="100%" stop-color="#8adb00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.44" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="48" height="48" rx="8.64" fill="url(#bg)"/>

  <!-- Glow circle behind icon -->
  <circle cx="24.0" cy="21.12" r="13.440000000000001" fill="rgba(200,241,53,0.07)"/>

  <!-- Split line (visual) -->
  <line x1="13.440000000000001" y1="21.12" x2="34.56" y2="21.12"
        stroke="url(#lime)" stroke-width="1.2000000000000002" stroke-linecap="round" opacity="0.3"/>

  <!-- Rs symbol left -->
  <text x="13.440000000000001" y="24.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="10.56"
        fill="url(#lime)" filter="url(#glow)">₹</text>

  <!-- Divide symbol center -->
  <text x="24.0" y="25.44"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="13.440000000000001"
        fill="#ffffff" opacity="0.9">÷</text>

  <!-- $ symbol right -->
  <text x="34.56" y="24.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="10.56"
        fill="url(#lime)" filter="url(#glow)">$</text>

  <!-- App name -->
  <text x="24.0" y="36.480000000000004"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="6.24"
        fill="#c8f135" letter-spacing="0.096">BILLSPLIT</text>

  <!-- Tagline -->
  <text x="24.0" y="42.24"
        text-anchor="middle" font-family="Arial, sans-serif"
        font-weight="400" font-size="3.5999999999999996"
        fill="rgba(255,255,255,0.35)" letter-spacing="0.048">PRO</text>
</svg>