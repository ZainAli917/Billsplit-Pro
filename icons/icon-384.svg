<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8f135"/>
      <stop offset="100%" stop-color="#8adb00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="11.52" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="384" height="384" rx="69.12" fill="url(#bg)"/>

  <!-- Glow circle behind icon -->
  <circle cx="192.0" cy="168.96" r="107.52000000000001" fill="rgba(200,241,53,0.07)"/>

  <!-- Split line (visual) -->
  <line x1="107.52000000000001" y1="168.96" x2="276.48" y2="168.96"
        stroke="url(#lime)" stroke-width="9.600000000000001" stroke-linecap="round" opacity="0.3"/>

  <!-- Rs symbol left -->
  <text x="107.52000000000001" y="192.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="84.48"
        fill="url(#lime)" filter="url(#glow)">₹</text>

  <!-- Divide symbol center -->
  <text x="192.0" y="203.52"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="107.52000000000001"
        fill="#ffffff" opacity="0.9">÷</text>

  <!-- $ symbol right -->
  <text x="276.48" y="192.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="84.48"
        fill="url(#lime)" filter="url(#glow)">$</text>

  <!-- App name -->
  <text x="192.0" y="291.84000000000003"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="49.92"
        fill="#c8f135" letter-spacing="0.768">BILLSPLIT</text>

  <!-- Tagline -->
  <text x="192.0" y="337.92"
        text-anchor="middle" font-family="Arial, sans-serif"
        font-weight="400" font-size="28.799999999999997"
        fill="rgba(255,255,255,0.35)" letter-spacing="0.384">PRO</text>
</svg>