<svg xmlns="http://www.w3.org/2000/svg" width="152" height="152" viewBox="0 0 152 152">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8f135"/>
      <stop offset="100%" stop-color="#8adb00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4.56" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="152" height="152" rx="27.36" fill="url(#bg)"/>

  <!-- Glow circle behind icon -->
  <circle cx="76.0" cy="66.88" r="42.56" fill="rgba(200,241,53,0.07)"/>

  <!-- Split line (visual) -->
  <line x1="42.56" y1="66.88" x2="109.44" y2="66.88"
        stroke="url(#lime)" stroke-width="3.8000000000000003" stroke-linecap="round" opacity="0.3"/>

  <!-- Rs symbol left -->
  <text x="42.56" y="76.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="33.44"
        fill="url(#lime)" filter="url(#glow)">₹</text>

  <!-- Divide symbol center -->
  <text x="76.0" y="80.56"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="42.56"
        fill="#ffffff" opacity="0.9">÷</text>

  <!-- $ symbol right -->
  <text x="109.44" y="76.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="33.44"
        fill="url(#lime)" filter="url(#glow)">$</text>

  <!-- App name -->
  <text x="76.0" y="115.52"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="19.76"
        fill="#c8f135" letter-spacing="0.304">BILLSPLIT</text>

  <!-- Tagline -->
  <text x="76.0" y="133.76"
        text-anchor="middle" font-family="Arial, sans-serif"
        font-weight="400" font-size="11.4"
        fill="rgba(255,255,255,0.35)" letter-spacing="0.152">PRO</text>
</svg>