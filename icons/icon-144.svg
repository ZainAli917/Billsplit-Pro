<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8f135"/>
      <stop offset="100%" stop-color="#8adb00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4.32" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="144" height="144" rx="25.919999999999998" fill="url(#bg)"/>

  <!-- Glow circle behind icon -->
  <circle cx="72.0" cy="63.36" r="40.32000000000001" fill="rgba(200,241,53,0.07)"/>

  <!-- Split line (visual) -->
  <line x1="40.32000000000001" y1="63.36" x2="103.67999999999999" y2="63.36"
        stroke="url(#lime)" stroke-width="3.6" stroke-linecap="round" opacity="0.3"/>

  <!-- Rs symbol left -->
  <text x="40.32000000000001" y="72.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="31.68"
        fill="url(#lime)" filter="url(#glow)">₹</text>

  <!-- Divide symbol center -->
  <text x="72.0" y="76.32000000000001"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="40.32000000000001"
        fill="#ffffff" opacity="0.9">÷</text>

  <!-- $ symbol right -->
  <text x="103.67999999999999" y="72.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="31.68"
        fill="url(#lime)" filter="url(#glow)">$</text>

  <!-- App name -->
  <text x="72.0" y="109.44"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="18.72"
        fill="#c8f135" letter-spacing="0.28800000000000003">BILLSPLIT</text>

  <!-- Tagline -->
  <text x="72.0" y="126.72"
        text-anchor="middle" font-family="Arial, sans-serif"
        font-weight="400" font-size="10.799999999999999"
        fill="rgba(255,255,255,0.35)" letter-spacing="0.14400000000000002">PRO</text>
</svg>