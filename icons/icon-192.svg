<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8f135"/>
      <stop offset="100%" stop-color="#8adb00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5.76" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="34.56" fill="url(#bg)"/>

  <!-- Glow circle behind icon -->
  <circle cx="96.0" cy="84.48" r="53.760000000000005" fill="rgba(200,241,53,0.07)"/>

  <!-- Split line (visual) -->
  <line x1="53.760000000000005" y1="84.48" x2="138.24" y2="84.48"
        stroke="url(#lime)" stroke-width="4.800000000000001" stroke-linecap="round" opacity="0.3"/>

  <!-- Rs symbol left -->
  <text x="53.760000000000005" y="96.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="42.24"
        fill="url(#lime)" filter="url(#glow)">₹</text>

  <!-- Divide symbol center -->
  <text x="96.0" y="101.76"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="53.760000000000005"
        fill="#ffffff" opacity="0.9">÷</text>

  <!-- $ symbol right -->
  <text x="138.24" y="96.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="42.24"
        fill="url(#lime)" filter="url(#glow)">$</text>

  <!-- App name -->
  <text x="96.0" y="145.92000000000002"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="24.96"
        fill="#c8f135" letter-spacing="0.384">BILLSPLIT</text>

  <!-- Tagline -->
  <text x="96.0" y="168.96"
        text-anchor="middle" font-family="Arial, sans-serif"
        font-weight="400" font-size="14.399999999999999"
        fill="rgba(255,255,255,0.35)" letter-spacing="0.192">PRO</text>
</svg>