<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8f135"/>
      <stop offset="100%" stop-color="#8adb00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7.68" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="46.08" fill="url(#bg)"/>

  <!-- Glow circle behind icon -->
  <circle cx="128.0" cy="112.64" r="71.68" fill="rgba(200,241,53,0.07)"/>

  <!-- Split line (visual) -->
  <line x1="71.68" y1="112.64" x2="184.32" y2="112.64"
        stroke="url(#lime)" stroke-width="6.4" stroke-linecap="round" opacity="0.3"/>

  <!-- Rs symbol left -->
  <text x="71.68" y="128.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="56.32"
        fill="url(#lime)" filter="url(#glow)">₹</text>

  <!-- Divide symbol center -->
  <text x="128.0" y="135.68"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="71.68"
        fill="#ffffff" opacity="0.9">÷</text>

  <!-- $ symbol right -->
  <text x="184.32" y="128.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="56.32"
        fill="url(#lime)" filter="url(#glow)">$</text>

  <!-- App name -->
  <text x="128.0" y="194.56"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="33.28"
        fill="#c8f135" letter-spacing="0.512">BILLSPLIT</text>

  <!-- Tagline -->
  <text x="128.0" y="225.28"
        text-anchor="middle" font-family="Arial, sans-serif"
        font-weight="400" font-size="19.2"
        fill="rgba(255,255,255,0.35)" letter-spacing="0.256">PRO</text>
</svg>