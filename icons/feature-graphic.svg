<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8f135"/>
      <stop offset="100%" stop-color="#8adb00"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <circle cx="200" cy="250" r="300" fill="rgba(200,241,53,0.04)"/>
  <circle cx="900" cy="100" r="200" fill="rgba(79,138,255,0.04)"/>

  <!-- Left: big icon -->
  <rect x="60" y="80" width="280" height="280" rx="60" fill="#1e1e28" stroke="rgba(200,241,53,0.2)" stroke-width="2"/>
  <text x="200" y="210" text-anchor="middle" font-family="Arial Black" font-weight="900" font-size="100" fill="rgba(255,255,255,0.1)">÷</text>
  <text x="140" y="215" text-anchor="middle" font-family="Arial Black" font-size="60" fill="url(#lime)">₹</text>
  <text x="200" y="230" text-anchor="middle" font-family="Arial Black" font-size="120" fill="white" opacity="0.9">÷</text>
  <text x="260" y="215" text-anchor="middle" font-family="Arial Black" font-size="60" fill="url(#lime)">$</text>
  <text x="200" y="315" text-anchor="middle" font-family="Arial Black" font-size="28" fill="#c8f135" letter-spacing="2">BILLSPLIT</text>

  <!-- Right: text -->
  <text x="420" y="160" font-family="Arial Black" font-weight="900" font-size="52" fill="white">Split Bills.</text>
  <text x="420" y="225" font-family="Arial Black" font-weight="900" font-size="52" fill="url(#lime)">Zero Drama.</text>
  <text x="420" y="295" font-family="Arial" font-size="22" fill="rgba(255,255,255,0.5)">Fair expense splitting for</text>
  <text x="420" y="325" font-family="Arial" font-size="22" fill="rgba(255,255,255,0.5)">friends, trips &amp; flatmates</text>

  <!-- Feature pills -->
  <rect x="420" y="360" width="140" height="36" rx="18" fill="rgba(200,241,53,0.12)" stroke="rgba(200,241,53,0.3)" stroke-width="1"/>
  <text x="490" y="383" text-anchor="middle" font-family="Arial" font-size="14" fill="#c8f135">✓ 100% Free</text>

  <rect x="572" y="360" width="160" height="36" rx="18" fill="rgba(79,138,255,0.12)" stroke="rgba(79,138,255,0.3)" stroke-width="1"/>
  <text x="652" y="383" text-anchor="middle" font-family="Arial" font-size="14" fill="#4f8aff">✓ Works Offline</text>

  <rect x="744" y="360" width="180" height="36" rx="18" fill="rgba(61,214,140,0.12)" stroke="rgba(61,214,140,0.3)" stroke-width="1"/>
  <text x="834" y="383" text-anchor="middle" font-family="Arial" font-size="14" fill="#3dd68c">✓ WhatsApp Share</text>
