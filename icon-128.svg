<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8f135"/>
      <stop offset="100%" stop-color="#8adb00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.84" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="23.04" fill="url(#bg)"/>

  <!-- Glow circle behind icon -->
  <circle cx="64.0" cy="56.32" r="35.84" fill="rgba(200,241,53,0.07)"/>

  <!-- Split line (visual) -->
  <line x1="35.84" y1="56.32" x2="92.16" y2="56.32"
        stroke="url(#lime)" stroke-width="3.2" stroke-linecap="round" opacity="0.3"/>

  <!-- Rs symbol left -->
  <text x="35.84" y="64.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="28.16"
        fill="url(#lime)" filter="url(#glow)">₹</text>

  <!-- Divide symbol center -->
  <text x="64.0" y="67.84"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="35.84"
        fill="#ffffff" opacity="0.9">÷</text>

  <!-- $ symbol right -->
  <text x="92.16" y="64.0"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="28.16"
        fill="url(#lime)" filter="url(#glow)">$</text>

  <!-- App name -->
  <text x="64.0" y="97.28"
        text-anchor="middle" font-family="Arial Black, sans-serif"
        font-weight="900" font-size="16.64"
        fill="#c8f135" letter-spacing="0.256">BILLSPLIT</text>

  <!-- Tagline -->
  <text x="64.0" y="112.64"
        text-anchor="middle" font-family="Arial, sans-serif"
        font-weight="400" font-size="9.6"
        fill="rgba(255,255,255,0.35)" letter-spacing="0.128">PRO</text>
</svg>